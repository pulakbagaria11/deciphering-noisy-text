# ---------- text ----------
charset: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"   # see note on ambiguous characters
min_len: 4
max_len: 8

# ---------- image ----------
image_height: 48          # fixed; width follows text length
margin: 6                 # padding around text, in pixels
background:
  gray_min: 225           # slightly off-white, randomized per image
  gray_max: 250
text_gray:
  min: 0
  max: 60                 # dark text with some variation

# ---------- fonts ----------
font_dir: fonts/
train_fonts:
  - Roboto-Regular.ttf
  - OpenSans-Bold.ttf
  - Lora-Regular.ttf
heldout_fonts:            # never used in training, only for generalization tests
  - Merriweather-Italic.ttf
  - Oswald-Regular.ttf
font_size_range: [28, 38]

# ---------- text-level variation ----------
char_jitter:              # per-character offsets before noise
  y_pixels: 3
  rotate_degrees: 8
  spacing_pixels: [-2, 3]

# ---------- noise levels ----------
# Each level is an ordered list of steps; "fn" matches a function in noise.py.
# Order matters: geometric distortion first, pixel noise and blur last.
levels:
  0: []
  1:
    - {fn: gaussian_noise, sigma: 8}
  2:
    - {fn: rotate_skew, theta_range: [-1, 1], shear_x_range: [-0.1, 0.1]}
    - {fn: gaussian_noise, sigma: 14}
    - {fn: salt_and_pepper, amount: 0.01}
  3:
    - {fn: rotate_skew, theta_range: [-2, 2], shear_x_range: [-0.2, 0.2]}
    - {fn: elastic_warp, alpha_range: [0.5, 1.0]}
    - {fn: random_lines, count: 1, thickness: 1}
    - {fn: gaussian_noise, sigma: 20}
    - {fn: salt_and_pepper, amount: 0.02}
  4:
    - {fn: rotate_skew, theta_range: [-3, 3], shear_x_range: [-0.25, 0.25]}
    - {fn: elastic_warp, alpha_range: [0.8, 1.5]}
    - {fn: curved_lines, count: 2, thickness: 1}
    - {fn: occlusion_blobs, count: 2, max_size: 6}
    - {fn: gaussian_noise, sigma: 26}
    - {fn: salt_and_pepper, amount: 0.03}
  5:
    - {fn: rotate_skew, theta_range: [-3, 3], shear_x_range: [-0.3, 0.3]}
    - {fn: elastic_warp, alpha_range: [1.0, 2.0]}
    - {fn: curved_lines, count: 3, thickness: 2}
    - {fn: occlusion_blobs, count: 3, max_size: 8}
    - {fn: gaussian_noise, sigma: 30}
    - {fn: salt_and_pepper, amount: 0.05}
# ---------- reproducibility ----------
seeds:
  train: 1
  val: 2
  test: 3